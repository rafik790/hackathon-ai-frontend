<section class="card" *ngIf="state$ | async as state">
  <header class="card-header">
    <div>
      <h2>Recent failures</h2>
      <div class="subtitle">
        Failed pipeline runs in the selected window. Open one to see the failing task and its analysis.
      </div>
    </div>
    <div class="actions">
      <a mat-button color="primary" routerLink="/pipeline-runs" [queryParams]="filters.namespace ? { status: 'failed', namespace: filters.namespace } : { status: 'failed' }">
        All failed runs <mat-icon iconPositionEnd>arrow_forward</mat-icon>
      </a>
    </div>
  </header>
  <ng-container *ngIf="pageRequest$ | async as page">
    <app-data-table
      [columns]="columns"
      [data]="rows$ | async"
      [totalElements]="state.data?.totalElements ?? 0"
      [pageIndex]="page.page"
      [pageSize]="page.size"
      [pageSizeOptions]="[8, 20, 50]"
      [sortActive]="page.sort"
      [sortDirection]="page.direction"
      [loading]="state.loading || (state.data !== null && (rows$ | async) === null)"
      [error]="state.error"
      [rowActions]="actions"
      [rowLabel]="rowLabel"
      emptyIcon="verified"
      emptyTitle="No failures in this window"
      emptyMessage="No PipelineRun failed in the selected time range."
      (pageChange)="onPage($event)"
      (sortChange)="onSort($event)"
      (rowClick)="open($event)"
      (action)="onAction($event)"
      (retry)="retry()"
    ></app-data-table>
  </ng-container>
</section>
