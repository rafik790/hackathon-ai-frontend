<ng-container *ngIf="filters$ | async as filters">
  <app-page-header title="Overview" description="Pipeline health at a glance. Open a failed run to see which task failed and why.">
    <ng-container pageMeta>
      <ng-container *ngIf="collector$ | async as collector">
        <a class="meta-link" routerLink="/monitoring" matTooltip="State of the Tekton collector, not of your pipelines">
          <app-status-badge [status]="collector.health" size="sm" [label]="'Monitoring: ' + (collector.health === 'HEALTHY' ? 'active' : collector.health === 'DEGRADED' ? 'degraded' : collector.health === 'DISABLED' ? 'disabled' : collector.health === 'UNREACHABLE' ? 'status unavailable' : 'waiting for data')"></app-status-badge>
        </a>
        <span class="meta-item" *ngIf="collector.data?.lastSuccessfulCycleAt as lastAt" [matTooltip]="(lastAt | date: 'medium') ?? ''">
          <mat-icon aria-hidden="true">history</mat-icon> Last collection {{ lastAt | relativeTime }}
        </span>
      </ng-container>
    </ng-container>

    <ng-container pageActions>
      <mat-form-field appearance="outline" class="compact-field ns-field density-compact">
        <mat-label>Namespace</mat-label>
        <mat-select [value]="filters.namespace ?? ''" (selectionChange)="setNamespace($event.value || null)">
          <mat-option value="">All namespaces</mat-option>
          <mat-option *ngFor="let ns of (namespaces$ | async) ?? []" [value]="ns">{{ ns }}</mat-option>
        </mat-select>
      </mat-form-field>
      <app-time-range-selector [value]="filters.range" (valueChange)="setRange($event)"></app-time-range-selector>
      <app-refresh-button label="Refresh" [loading]="(summary$ | async)?.loading ?? false" (refresh)="reload()"></app-refresh-button>
    </ng-container>
  </app-page-header>

  <div class="page-stack">
    <ng-container *ngIf="summary$ | async as summary">
      <app-error-state *ngIf="summary.error" [inline]="true" [error]="summary.error" (retry)="reload()"></app-error-state>

      <div class="kpi-grid" aria-label="Key metrics">
        <app-kpi-card
          *ngFor="let kpi of (kpis$ | async) ?? []"
          [label]="kpi.label"
          [value]="kpi.value"
          [icon]="kpi.icon"
          [tone]="kpi.tone"
          [caption]="kpi.caption"
          [loading]="summary.loading"
          [link]="kpi.link"
          [linkQueryParams]="kpi.queryParams"
        ></app-kpi-card>
      </div>
    </ng-container>

    <ng-container *ngIf="trends$ | async as trends">
      <app-chart-card
        title="Pipeline runs over time"
        [subtitle]="'Per ' + (trends.data?.granularity === 'HOUR' ? 'hour' : 'day') + ' by status · ' + rangeLabel(filters.range)"
        [loading]="trends.loading"
        [error]="trends.error"
        [hasData]="(hasTrendData$ | async) ?? false"
        [height]="260"
        footnote="Buckets are aligned to UTC and shown in your local time."
        (retry)="reload()"
      >
        <app-execution-trend-chart [trend]="trends.data"></app-execution-trend-chart>
      </app-chart-card>
    </ng-container>

    <app-recent-pipeline-runs [filters]="filters"></app-recent-pipeline-runs>
  </div>
</ng-container>
